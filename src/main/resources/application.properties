spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/beachmatch
POSTGRESQL_DATABASENAME = beatchmatch
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

# Jpa instellingen
spring.jpa.show-sql=true

# forces to generate the data structures
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create

# database initialization with data.sql after hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak
realm = BeachMatch
client-id = BeachMatch
client-secret = ${KEYCLOAK_CLIENT_SECRET}
issuer-uri = http://localhost:9090/realms/${realm}
audience = account
spring.security.oauth2.resourceserver.jwt.issuer-uri = ${issuer-uri}
spring.security.oauth2.resourceserver.jwt.audiences = ${audience}